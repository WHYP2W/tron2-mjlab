[project]
name = "tron2-mjlab"
version = "0.1.0"
description = "Flat-terrain velocity training for TRON2A SFYG"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
	"mjlab==1.1.0",
	"mujoco==3.5.0",
	"mujoco-warp==3.5.0",
	"warp-lang==1.12.0",
	"scipy>=1.10",
]

[project.scripts]
tron2-play = "tron2_mjlab.play:main"

[project.entry-points."mjlab.tasks"]
tron2_mjlab = "tron2_mjlab"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
